name: Spring Boot CI

on:
  push:
    branches: [ "main" ]        # Trigger when you push to main
  pull_request:
    branches: [ "main" ]        # Trigger on PR to main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        working-directory: cicd-demo      # Important: your Spring Boot project folder
        run: mvn clean install

