name: Spring Boot CI-CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3️⃣ Run tests
      - name: Run tests
        working-directory: 05_Spring/cicd-demo
        run: mvn test

      # 4️⃣ Build JAR
      - name: Build JAR
        working-directory: 05_Spring/cicd-demo
        run: mvn clean package -DskipTests

      # 5️⃣ VERIFY JAR EXISTS (IMPORTANT)
      - name: Verify JAR file
        run: |
          echo "Listing target folder"
          ls -l 05_Spring/cicd-demo/target
          
      - name: Debug workspace
        run: |
         echo "Current directory:"
         pwd
         echo "List root:"
            ls -l
          echo "List 05_Spring:"
          ls -l 05_Spring
         echo "List cicd-demo:"
         ls -l 05_Spring/cicd-demo
         echo "List target:"
         ls -l 05_Spring/cicd-demo/target

      # 6️⃣ Copy JAR to EC2
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "05_Spring/cicd-demo/target/*.jar"
          target: "/home/ubuntu/app/"

      # 7️⃣ Restart Spring Boot app
      - name: Restart Spring Boot
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            pkill -f 'java -jar' || true
            nohup java -jar /home/ubuntu/app/*.jar > app.log 2>&1 &
