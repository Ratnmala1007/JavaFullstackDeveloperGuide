name: Build and Deploy Spring Boot App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build project
      run: |
        cd 05_Spring/cicd-demo
        mvn clean package -DskipTests

    - name: Verify JAR file
      run: |
        ls -l 05_Spring/cicd-demo/target/

    - name: Copy JAR to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "05_Spring/cicd-demo/target/cicd-demo-0.0.1-SNAPSHOT.jar"
        target: "/home/ubuntu/app/"
        overwrite: true

    - name: Restart Spring Boot app
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          pkill -f cicd-demo || true
          nohup java -jar /home/ubuntu/app/cicd-demo-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
