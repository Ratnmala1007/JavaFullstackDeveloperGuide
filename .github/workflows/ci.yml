name: Spring Boot CI (Verify JAR)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build project
        working-directory: 05_Spring/cicd-demo
        run: mvn clean package

      - name: Verify JAR file
        run: |
          echo "=== TARGET DIRECTORY CONTENT ==="
          ls -l 05_Spring/cicd-demo/target
