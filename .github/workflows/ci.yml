name: Spring Boot CI-CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3️⃣ Build JAR
      - name: Build project
        working-directory: 05_Spring/cicd-demo
        run: mvn clean package -DskipTests

      # 4️⃣ Verify JAR
      - name: Verify JAR
        run: ls -l 05_Spring/cicd-demo/target

      # 5️⃣ Copy JAR to EC2
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "05_Spring/cicd-demo/target/cicd-demo-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/app/"
          timeout: 120s

      # 6️⃣ Restart App
      - name: Restart Spring Boot safely
        uses: appleboy/ssh-action@v0.1.7
        with:
           host: ${{ secrets.EC2_HOST }}
           username: ubuntu
           key: ${{ secrets.EC2_SSH_KEY }}
           script: |
            echo "Checking existing app..."
            PID=$(pgrep -f cicd-demo-0.0.1-SNAPSHOT.jar || true)

              if [ -n "$PID" ]; then
            echo "Stopping old app PID=$PID"
              kill -9 $PID
             sleep 3
            fi

            echo "Starting new app..."
            cd /home/ubuntu/app
            nohup java -jar cicd-demo-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
            echo "App started"
