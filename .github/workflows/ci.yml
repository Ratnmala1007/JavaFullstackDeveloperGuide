name: Spring Boot CI-CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Build project
      run: |
        cd 05_Spring/cicd-demo
        mvn clean package -DskipTests

    - name: Verify JAR
      run: |
        ls -l 05_Spring/cicd-demo/target

    # 🔐 Write SSH key to file
    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
        chmod 600 ~/.ssh/ec2_key
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    # 🚀 Copy JAR using rsync (MOST IMPORTANT FIX)
    - name: Copy JAR to EC2
      run: |
        rsync -avz -e "ssh -i ~/.ssh/ec2_key" \
        05_Spring/cicd-demo/target/cicd-demo-0.0.1-SNAPSHOT.jar \
        ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/app/

    - name: Restart Spring Boot App
      run: |
        ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          pkill -f cicd-demo || true
          nohup java -jar /home/ubuntu/app/cicd-demo-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
        EOF
