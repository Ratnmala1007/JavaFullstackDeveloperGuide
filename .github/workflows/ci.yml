name: Spring Boot CI-CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3️⃣ Build project
      - name: Build project
        working-directory: 05_Spring/cicd-demo
        run: mvn clean package -DskipTests

      # 4️⃣ Verify JAR exists
      - name: Verify JAR file
        run: |
          ls -l 05_Spring/cicd-demo/target

      # 5️⃣ Configure SSH (IMPORTANT)
      - name: Configure SSH
        run: |
          mkdir -p $HOME/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > $HOME/.ssh/id_rsa
          chmod 600 $HOME/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> $HOME/.ssh/known_hosts

      # 6️⃣ Copy JAR to EC2
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key_path: $HOME/.ssh/id_rsa
          source: "05_Spring/cicd-demo/target/cicd-demo-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/app/"

      # 7️⃣ Restart Spring Boot app
      - name: Restart Spring Boot app
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key_path: $HOME/.ssh/id_rsa
          script: |
            pkill -f 'java -jar' || true
            nohup java -jar /home/ubuntu/app/cicd-demo-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
