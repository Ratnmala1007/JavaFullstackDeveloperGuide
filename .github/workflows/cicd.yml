name: Spring Boot CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21

      # 3️⃣ Build the Spring Boot jar
      - name: Build Spring Boot JAR
        run: ./mvnw clean package -DskipTests

      # 4️⃣ Copy the jar to EC2
      - name: Copy JAR to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > cicd-springboot-key.pem
          chmod 600 cicd-springboot-key.pem
          scp -o StrictHostKeyChecking=no -i cicd-springboot-key.pem target/cicd-demo-0.0.1-SNAPSHOT.jar ubuntu@<EC2_IP>:/home/ubuntu/

      # 5️⃣ Restart Spring Boot app on EC2
      - name: Start app on EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > cicd-springboot-key.pem
          chmod 600 cicd-springboot-key.pem
          ssh -o StrictHostKeyChecking=no -i cicd-springboot-key.pem ubuntu@<EC2_IP> "
            pkill -f 'cicd-demo-0.0.1-SNAPSHOT.jar' || true
            nohup java -jar cicd-demo-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          "
