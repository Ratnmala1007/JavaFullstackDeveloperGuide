name: Spring Boot CI-CD

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        working-directory: 05_Spring/cicd-demo
        run: mvn clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "05_Spring/cicd-demo/target/cicd-demo-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/app/"

      - name: Restart Spring Boot App
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            pkill -f cicd-demo || true
            nohup java -jar /home/ubuntu/app/cicd-demo-0.0.1-SNAPSHOT.jar > app.log 2>&1 &


      

